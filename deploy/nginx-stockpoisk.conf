# Прокси поддомена на контейнер «СтокПоиск» (127.0.0.1:8080).
# 1) подставь свой домен в server_name
# 2) скопируй в /etc/nginx/sites-available/stockpoisk.conf
# 3) ln -s в sites-enabled, nginx -t, systemctl reload nginx
# 4) выпусти HTTPS: sudo certbot --nginx -d stockpoisk.ВАШ-ДОМЕН.ru
#    (certbot сам допишет блок listen 443 + сертификаты)

server {
    listen 80;
    server_name stockpoisk.ВАШ-ДОМЕН.ru;

    # лимит на загрузку файлов импорта
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
