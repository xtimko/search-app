<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111114" />
    <title>Search-app — весь сток реселлеров в одном поиске</title>
    <!-- Анти-FOUC: применяем сохранённую тему до загрузки CSS/бандла -->
    <script>
      try {
        var saTheme = localStorage.getItem('sa_theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = saTheme
        document.documentElement.style.background = saTheme === 'light' ? '#f5f5f7' : '#111114'
      } catch (e) {
        document.documentElement.style.background = '#111114'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
